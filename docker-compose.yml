# Sobe um PostgreSQL 16 já com o esquema e os dados carregados, e um pgAdmin 4.
#   docker compose up -d
#   PostgreSQL: localhost:5432  (usuário postgres / senha postgres, banco clinica_vet)
#   pgAdmin:    http://localhost:5050  (admin@clinica.local / admin)
# Para recarregar do zero: docker compose down -v && docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinica_vet
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    command: ["postgres", "-c", "timezone=America/Sao_Paulo"]
    ports:
      - "5432:5432"
    volumes:
      # o banco já é criado por POSTGRES_DB; os scripts rodam em ordem alfabética
      - ./sql/01_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
      - ./sql/02_dml.sql:/docker-entrypoint-initdb.d/02_dml.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinica_vet"]
      interval: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@clinica.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
